name: release-env

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

env:
  HEX_API_URL: https://staging.hex.pm/api

defaults:
  run:
    shell: bash

jobs:
  no-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: T3 no environment is refused
        run: |
          . scripts/wi.sh
          oidc o; exchange package:hexpm/wi_e2e_public o t; expect 403 access_denied "No matching workload identity"

  with-env:
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@v4
      - name: T3 environment Release matches release
        run: |
          . scripts/wi.sh
          oidc o; exchange package:hexpm/wi_e2e_public o t; expect 200
